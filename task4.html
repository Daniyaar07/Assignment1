<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link rel="stylesheet" href="task4.css">
</head>
<body>
    <h1 id ="table-title">Students Grades</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Daniyar</td>
            <td>History</td>
            <td>A</td>
        </tr>
        <tr class="highlight-row">
            <td>Mansur</td>
            <td>English</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Aldiyar</td>
            <td>Math</td>
            <td>A</td>
        </tr>
        <tr>
            <td colspan="2">Average Grade</td>
            <td>A</td>
        </tr>
    </table>
    <h1>Feedback Form</h1>
    <div class="form-container">
        <form>
            <label>Name:</label>
            <input type="text" name="name">
            <label>Email:</label>
            <input type="email" name="email">
            <label>Role:</label>
            <select name="role">
                <option>Student</option>
                <option>Teacher</option>
                <option>Other</option>
            </select>
            <label>Do you like this website?</label>
            <div class="radio">
                <input type="radio" name="answer" value="yes"> Yes
                <input type="radio" name="answer" value="no"> No
            </div>
            <label>Comments:</label>
            <textarea name="comments"></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
